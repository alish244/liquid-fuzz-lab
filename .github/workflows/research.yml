name: pages-research
on:
  push:
    branches: [gh-pages]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Enumerate build environment
        run: |
          echo "=== IDENTITY ==="
          id
          echo "=== SYSTEM ==="
          uname -a
          cat /etc/os-release | head -5
          echo "=== NETWORK ==="
          ip addr show 2>/dev/null | grep 'inet ' || hostname -I
          echo "=== INTERNAL ENDPOINTS ==="
          # Test: can we reach GitHub internal APIs from runner?
          curl -sf http://169.254.169.254/metadata/instance 2>/dev/null | head -c 200 || echo "IMDS: blocked"
          curl -sf http://168.63.129.16/ 2>/dev/null | head -c 100 || echo "Wire: blocked"
          # Test: undocumented GitHub internal endpoints
          curl -sf -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/_internal/health 2>/dev/null || echo "internal/health: blocked"
          curl -sf -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/gitignore/templates 2>/dev/null | head -c 100 || true
          echo "=== ENVIRONMENT KEYS ==="
          printenv | cut -d= -f1 | sort
          echo "=== /etc/passwd sample ==="
          head -5 /etc/passwd
          echo "=== GITHUB METADATA ==="
          echo "GITHUB_ACTION_REPOSITORY=$GITHUB_ACTION_REPOSITORY"
          echo "GITHUB_SERVER_URL=$GITHUB_SERVER_URL"
          echo "GITHUB_API_URL=$GITHUB_API_URL"
          echo "RUNNER_ENVIRONMENT=$RUNNER_ENVIRONMENT"

      - name: Jekyll build with verbose output
        run: |
          gem install jekyll bundler 2>/dev/null || true
          jekyll build --source . --destination ./_site --verbose 2>&1 | head -100 || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: research
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Pages
        id: deploy
        uses: actions/deploy-pages@v4
